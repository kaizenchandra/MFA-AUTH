limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
log_format network '$remote_addr $request_method $uri $status $request_time';
access_log /dev/stdout network;
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 16k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:18180" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control no-store always;
  location /api/ { proxy_pass http://backend:8080; include /etc/nginx/proxy_params.network; }
  location /oauth2/ { limit_req zone=auth burst=10 nodelay; proxy_pass http://backend:8080; include /etc/nginx/proxy_params.network; }
  location /login/ { proxy_pass http://backend:8080; include /etc/nginx/proxy_params.network; }
  location / { try_files $uri /index.html; }
}
