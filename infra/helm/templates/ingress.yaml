apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: network
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 16k
spec:
  ingressClassName: {{ .Values.ingressClass }}
  tls:
    - hosts: [{{ .Values.appHost }}]
      secretName: {{ .Values.tlsSecret }}
  rules:
    - host: {{ .Values.appHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {number: 8080}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
spec:
  ingressClassName: {{ .Values.ingressClass }}
  tls:
    - hosts: [{{ .Values.identityHost }}]
      secretName: {{ .Values.identityTlsSecret }}
  rules:
    - host: {{ .Values.identityHost }}
      http:
        paths:
          - path: /realms/
            pathType: Prefix
            backend:
              service: {name: keycloak, port: {number: 8080}}
          - path: /resources/
            pathType: Prefix
            backend:
              service: {name: keycloak, port: {number: 8080}}
